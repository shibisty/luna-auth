openapi: 3.1.0
info:
  title: Luna Auth API
  version: 0.1.0
  summary: Registration and login of the end users of client applications.
  description: |
    Every `/v1` request carries an API key of an application registered in the Luna dashboard,
    in the `X-API-Key` header. The key decides the application and what the request may do
    (its scopes); users belong to one application, and a token of one application is refused by
    another.

    - **Server keys** (`sk_live_…`) are secret and live in a client's backend. Requests with an
      `Origin` header are refused.
    - **Browser keys** (`pk_live_…`) are public, work only from the application's allowed origins
      and hold `auth:login` only. Browsers' preflight requests are answered without a key.

    A login answers with an **access token** (a JWT for `Authorization: Bearer`, 15 minutes by
    default) and a **refresh token** (30 days, rotated on every use: presenting a spent one again
    ends that login everywhere).

    Errors are `{"error": "…"}`; validation errors are `422` with `errors` by field.
    Registration, login and reset requests are limited to 10 a minute per application and client
    address (`429` with `Retry-After`).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:8081
    description: local (gtr dev)
  - url: https://auth.luna.local
    description: behind nginx
security:
  - apiKey: []
tags:
  - name: users
    description: Registration, login and the user's own account (scope `auth:login`).
  - name: tokens
    description: Refreshing, revoking and verifying tokens (scope `auth:login`).
  - name: password
    description: Password reset by email (scope `auth:login`).
  - name: admin
    description: The application's users, for its backend (server keys with `auth:users.read` / `auth:users.write`).
  - name: service
    description: Liveness and key checks.

paths:
  /healthz:
    get:
      tags: [service]
      summary: Liveness
      operationId: health
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  app: { type: string, example: luna-auth }
                required: [status]

  /v1/ping:
    get:
      tags: [service]
      summary: Which application a key belongs to
      description: A quick check of an integration. Scope `auth:login`.
      operationId: ping
      responses:
        "200":
          description: The key's application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ping" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/users:
    post:
      tags: [users]
      summary: Register a user
      description: Creates a user of the application and logs them in. Scope `auth:login`.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered and logged in.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }
    get:
      tags: [admin]
      summary: List the application's users
      description: Newest first. Scope `auth:users.read`.
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The user's id.
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      summary: Get a user
      description: Scope `auth:users.read`.
      operationId: getUser
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }
    patch:
      tags: [admin]
      summary: Change a user
      description: |
        Only the fields sent change. A new email clears `email_verified`; an empty `username`
        removes it; a new password ends every login of the user. Scope `auth:users.write`.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: The changed user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }
    delete:
      tags: [admin]
      summary: Delete a user
      description: Deletes the user and ends every login of theirs. Scope `auth:users.write`.
      operationId: deleteUser
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/sessions:
    post:
      tags: [users]
      summary: Log in
      description: |
        By username or email (a login containing `@` is an email) and password; both are
        compared case-insensitively. Scope `auth:login`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401":
          description: Wrong login or password (not told apart), or an invalid key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/me:
    get:
      tags: [users]
      summary: The user of an access token
      description: Scope `auth:login` for the key, plus the user's access token.
      operationId: me
      security:
        - apiKey: []
          bearer: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: No or an invalid key, a missing, invalid or expired access token, or a deleted user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/tokens/refresh:
    post:
      tags: [tokens]
      summary: Refresh tokens
      description: |
        A new pair for a refresh token, which is spent. Presenting a spent token again ends that
        login (every token of it). A refresh token works only with its own application's key.
        Scope `auth:login`.
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: A new pair.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Invalid, expired, reused or another application's refresh token; or an invalid key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/tokens/revoke:
    post:
      tags: [tokens]
      summary: Log out
      description: Ends the login of a refresh token. Answers 204 for unknown tokens too. Scope `auth:login`.
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/tokens/verify:
    post:
      tags: [tokens]
      summary: Verify an access token
      description: |
        For a client's backend: whether an access token is valid for this application and whose
        it is (RFC 7662 style). An invalid token is `200` with `active: false`. Scope `auth:login`.
      operationId: verifyToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, maxLength: 4096, description: The access token. }
              required: [token]
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyResult" }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/password/forgot:
    post:
      tags: [password]
      summary: Ask for a password reset email
      description: |
        Emails a link to the application's password reset URL (set in the dashboard) with
        `?token=…`, valid for 30 minutes, if the email belongs to a user; answers `202` either
        way. Scope `auth:login`.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email, maxLength: 254 }
              required: [email]
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "409":
          description: The application has no password reset URL.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

  /v1/password/reset:
    post:
      tags: [password]
      summary: Set a new password with a reset token
      description: The token is spent, and every login of the user ends. Scope `auth:login`.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string, maxLength: 200, description: The `token` of the emailed link. }
                password: { type: string, minLength: 8, maxLength: 200, format: password }
              required: [token, password]
      responses:
        "204": { description: The password is changed. }
        "401": { $ref: "#/components/responses/KeyInvalid" }
        "403": { $ref: "#/components/responses/KeyForbidden" }
        "422":
          description: An invalid, used or expired token (`errors.token`), or an invalid password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "503": { $ref: "#/components/responses/KeysUnavailable" }

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: An application's key from the Luna dashboard (`sk_live_…` or `pk_live_…`).
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The user's access token from a login.

  headers:
    NoStore:
      description: Tokens are never cached.
      schema: { type: string, const: no-store }

  responses:
    KeyInvalid:
      description: No API key, or a malformed, unknown or revoked one.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyForbidden:
      description: |
        The key lacks the scope, a browser key came from an origin it does not allow, a server key
        was sent from a browser, or the client address is outside the key's networks.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeysUnavailable:
      description: The dashboard cannot be asked about the key right now.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such user in this application.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: The request body is invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    TooManyRequests:
      description: Too many attempts from this address for this application.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Invalid API key }
      required: [error]

    ValidationError:
      type: object
      properties:
        error: { type: string, example: The given data was invalid. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example:
            email: ["The email has already been taken."]
      required: [error, errors]

    Ping:
      type: object
      properties:
        app_id: { type: string, format: uuid }
        app_name: { type: string, example: Shop }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
      required: [app_id, scopes]

    Scope:
      type: string
      enum: [auth:login, auth:users.read, auth:users.write, pages:read, pages:write]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username:
          type: [string, "null"]
          description: Lower-case; 3–32 of `a-z 0-9 . _ -`, starting with a letter or a digit.
          example: ann
        email: { type: string, format: email, example: ann@example.com }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, username, email, email_verified, created_at, updated_at]

    UserPage:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/User" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
      required: [data, page, per_page, total, last_page]

    TokenPair:
      type: object
      properties:
        access_token: { type: string, description: "A JWT: iss luna-auth, aud the application id, sub the user id." }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds the access token lives. }
      required: [access_token, refresh_token, token_type, expires_in]

    Session:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            user: { $ref: "#/components/schemas/User" }
          required: [user]

    VerifyResult:
      oneOf:
        - type: object
          properties:
            active: { type: boolean, const: true }
            sub: { type: string, format: uuid }
            exp: { type: integer, description: Unix time the token expires. }
            user: { $ref: "#/components/schemas/User" }
          required: [active, sub, exp, user]
        - type: object
          properties:
            active: { type: boolean, const: false }
          required: [active]

    RegisterRequest:
      type: object
      properties:
        username: { type: string, maxLength: 32, description: "Optional; see User.username." }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 200, format: password }
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        login: { type: string, maxLength: 254, description: A username or an email. }
        password: { type: string, maxLength: 200, format: password }
      required: [login, password]

    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string, maxLength: 200 }
      required: [refresh_token]

    UpdateUserRequest:
      type: object
      properties:
        username: { type: string, maxLength: 32, description: '"" removes the username.' }
        email: { type: string, format: email, maxLength: 254 }
        email_verified: { type: boolean }
        password: { type: string, minLength: 8, maxLength: 200, format: password }
      minProperties: 1
