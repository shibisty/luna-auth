openapi: 3.0.3
info:
  title: Auth Service API
  version: "1.0.0"
  description: API для аутентификации, регистрации и проверки JWT
servers:
  - url: /api/v1
paths:
  /register:
    post:
      summary: Регистрация нового пользователя
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: user registered successfully
        "400":
          description: Некорректный запрос
        "409":
          description: Пользователь уже существует
  /login:
    post:
      summary: Логин и получение JWT
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        "200":
          description: JWT токен успешно выдан
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: bearer
        "400":
          description: Некорректный запрос
        "401":
          description: Неверные учетные данные
  /verify:
    get:
      summary: Проверка валидности JWT
      tags:
        - Auth
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: JWT токен
      responses:
        "200":
          description: Токен валиден
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
                  claims:
                    type: object
                    example:
                      sub: 1
                      exp: 1718000000
        "401":
          description: Токен недействителен или просрочен
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - BearerAuth: []
tags:
  - name: Auth
    description: Эндпоинты регистрации, логина и проверки токена
